name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── CI: Test ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check for secrets leak
        run: |
          # Fail if hardcoded secrets found (variable assignment pattern only)
          if grep -rE "^(PASSWORD|SECRET|TOKEN|API_KEY)\s*=\s*['\"][^'\"]+" \
            --include="*.py" --include="*.sql" \
            --exclude-dir=".git" --exclude-dir=".github" .; then
            echo "Hardcoded secret detected — failing"
            exit 1
          fi

      - name: dbt compile (validate SQL)
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        run: |
          cd dbt
          dbt deps --quiet
          dbt compile --target dev 2>&1 | grep -E "ERROR|WARNING|Completed" || true

      - name: Python tests
        run: |
          python -m pytest extractors/facebook/test_extract.py -v --tb=short

  # ── CD: Deploy ───────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/ats-dw

            echo "--- Pulling latest code ---"
            git pull origin main

            echo "--- Rebuilding changed images ---"
            docker compose -f infra/docker-compose.yml build

            echo "--- Restarting services ---"
            docker compose -f infra/docker-compose.yml up -d --force-recreate

            echo "--- Installing dbt packages inside Airflow runtime ---"
            sleep 10
            docker exec --user root de_airflow_scheduler bash -lc "mkdir -p /opt/airflow/dbt/dbt_packages /tmp/dbt-logs && chmod -R a+rwX /opt/airflow/dbt/dbt_packages /tmp/dbt-logs"
            docker exec de_airflow_scheduler bash -lc "cd /opt/airflow/dbt && dbt deps --log-path /tmp/dbt-logs"

            echo "--- Connect to Traefik network ---"
            docker network connect web de_metabase 2>/dev/null || true
            docker network connect web de_airflow_web 2>/dev/null || true
            docker restart traefik

            echo "--- Health check ---"
            sleep 10
            docker compose -f infra/docker-compose.yml ps

            echo "--- Deploy complete ---"
